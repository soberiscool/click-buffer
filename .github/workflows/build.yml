name: Build Click Buffer Mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Geode CLI
      uses: geode-sdk/cli/.github/actions/setup@main
      with:
        geode-version: '5.11.2'
        
    - name: Build Mod
      run: geode build
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: click-buffer.geode
        path: build/click-buffer.geode
        retention-days: 7
